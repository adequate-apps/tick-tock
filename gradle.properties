org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# JDK 21 is the only supported build JDK. Gradle must never fetch one on its own;
# set JAVA_HOME explicitly instead (see README).
org.gradle.java.installations.auto-download=false
# Every resolved artifact must match gradle/verification-metadata.xml.
org.gradle.dependency.verification=strict
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP must never fetch a missing SDK component (platform, build-tools, NDK, CMake)
# on its own; a missing one fails the build and is installed by exact package id.
android.builder.sdkDownload=false
