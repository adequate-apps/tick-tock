# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every push and PR: identity scan (with the private denylist from a secret),
# wrapper hashes, strict dependency verification, the JVM and host-test tiers, lint, a debug
# APK, the manifest allowlist, the 16 KB page-alignment check of the native
# libraries, the release guard and, on PRs, the red-on-base proof. Actions are
# pinned to full commit SHAs; the tag is a comment so a reviewer can see what
# the SHA was resolved from.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  WRAPPER_JAR_SHA256: 497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7
  ROBOLECTRIC_JAR: android-all-instrumented-16-robolectric-13921718-i7.jar
  # Belt and braces with gradle.properties: an artifact missing from
  # gradle/verification-metadata.xml fails the job.
  GRADLE_OPTS: -Dorg.gradle.dependency.verification=strict
  # The two SDK packages the build pins that the runner image does not carry.
  # They are installed by exact package id in their own step, so the build
  # never fetches an SDK component on its own (android.builder.sdkDownload is
  # off in gradle.properties). Bumping either id is a reviewed change here and
  # in gradle/libs.versions.toml together.
  SDK_PACKAGES: ndk;28.2.13676358 cmake;3.22.1
  # GoogleTest for the N tier's host tests, from Ubuntu 24.04's archive.
  GTEST_DEB_VERSION: 1.14.0-1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The PR's own head, never the synthetic merge commit: its committer
          # would fail the identity check. The scan reads the whole history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Write the denylist from its secret
        env:
          DENYLIST: ${{ secrets.TICKTOCK_DENYLIST }}
        # The path goes through GITHUB_ENV because the runner context is not
        # available to the workflow-level env block; a reference to it there
        # fails validation and no job starts.
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "the TICKTOCK_DENYLIST secret is not available to this run; the scan cannot be complete" >&2
            exit 1
          fi
          (umask 077 && printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist")
          echo "TICKTOCK_DENYLIST=$RUNNER_TEMP/denylist" >> "$GITHUB_ENV"

      - name: Identity scan over the tree and the whole history
        run: |
          tools/identity-scan.sh --tree
          tools/identity-scan.sh --history

      - name: Identity scan over the PR range, title, body and branch name
        if: github.event_name == 'pull_request'
        env:
          # Passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          tools/identity-scan.sh --text "$RUNNER_TEMP/pr.txt"
          tools/identity-scan.sh --branch "$PR_BRANCH"
          tools/identity-scan.sh --range "$BASE_SHA..$HEAD_SHA"

      - name: Verify the Gradle wrapper
        run: |
          echo "${WRAPPER_JAR_SHA256}  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties
          grep -q '^validateDistributionUrl=true' gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ github.event_name == 'push' && 'gradle' || '' }}
          cache-dependency-path: |
            gradle/verification-metadata.xml
            gradle/wrapper/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Install the pinned SDK packages the image lacks
        # Exact package ids only; sdkmanager verifies each archive against the
        # checksum in Google's repository manifest. A package already on the
        # image is a no-op.
        run: |
          # shellcheck disable=SC2086  # SDK_PACKAGES is a space-separated list of ids
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" $SDK_PACKAGES
          for p in $SDK_PACKAGES; do
            [ -d "$ANDROID_SDK_ROOT/${p/;//}" ] || { echo "sdkmanager did not install $p" >&2; exit 1; }
          done

      - name: Install GoogleTest for the host tests
        # The N tier's host tests link gtest (pacman's 1.18 on a workstation).
        # Ubuntu's signed archive, one exact version, test-only: nothing from
        # it reaches the app. Bumping the version is a reviewed change here.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "libgtest-dev=${GTEST_DEB_VERSION}"
          [ "$(dpkg-query -W -f='${Version}' libgtest-dev)" = "$GTEST_DEB_VERSION" ] \
            || { echo "libgtest-dev is not $GTEST_DEB_VERSION" >&2; exit 1; }

      - name: Stage the Robolectric runtime
        run: |
          curl -sSfL -o "tools/robolectric-deps/${ROBOLECTRIC_JAR}" \
            "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/${ROBOLECTRIC_JAR}"
          (cd tools/robolectric-deps && sha256sum -c MANIFEST.sha256)

      - name: Full gate (sources, U, N, H, lint, APK, manifest, 16 KB alignment)
        env:
          # On a push this is the previous tip; on a new branch it is all zeros
          # and verify.sh falls back to the merge base with main.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/verify.sh --base "$BASE_SHA"

      - name: Prove the PR's tests are red on the base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/prove-red.sh --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Release guard fires on a placeholder id
        # The real path, assembleRelease, must stop on the guard and say so;
        # running the guard task alone would stay green if its hookup into
        # preReleaseBuild ever broke. The override plants a com.example id.
        run: |
          if ./gradlew --no-daemon --console=plain -Pticktock.applicationIdOverride=com.example.guardproof :app:assembleRelease > "$RUNNER_TEMP/release.log" 2>&1; then
            echo "assembleRelease succeeded on a placeholder id" >&2
            exit 1
          fi
          grep -q 'Release builds are blocked' "$RUNNER_TEMP/release.log" \
            || { tail -40 "$RUNNER_TEMP/release.log"; echo "assembleRelease failed for another reason than the guard" >&2; exit 1; }

      - name: Release guards and temporary signing fixtures
        shell: bash
        run: |
          tools/test-release-dependencies.sh
          tools/test-release-metadata.sh
          python3 tools/test-stage-signing.py
          python3 tools/test-release-source.py
          tools/test-signing-gate.sh
          tools/test-release.sh | tee "$RUNNER_TEMP/release-fixtures.log"
          fixture=$(sed -n 's/^Temporary fixture: //p' "$RUNNER_TEMP/release-fixtures.log")
          python3 tools/test-release-validation.py "$fixture"

  # The gate's own proof: eleven cases exercise the control and planted failures. It
  # rebuilds the tree once per case, so it runs on main only.
  selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Write the denylist from its secret
        env:
          DENYLIST: ${{ secrets.TICKTOCK_DENYLIST }}
        run: |
          [ -n "$DENYLIST" ] || { echo "the TICKTOCK_DENYLIST secret is not available to this run" >&2; exit 1; }
          (umask 077 && printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist")
          echo "TICKTOCK_DENYLIST=$RUNNER_TEMP/denylist" >> "$GITHUB_ENV"

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the pinned SDK packages the image lacks
        # Exact package ids only; sdkmanager verifies each archive against the
        # checksum in Google's repository manifest. A package already on the
        # image is a no-op.
        run: |
          # shellcheck disable=SC2086  # SDK_PACKAGES is a space-separated list of ids
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" $SDK_PACKAGES
          for p in $SDK_PACKAGES; do
            [ -d "$ANDROID_SDK_ROOT/${p/;//}" ] || { echo "sdkmanager did not install $p" >&2; exit 1; }
          done

      - name: Install GoogleTest for the host tests
        # The N tier's host tests link gtest (pacman's 1.18 on a workstation).
        # Ubuntu's signed archive, one exact version, test-only: nothing from
        # it reaches the app. Bumping the version is a reviewed change here.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "libgtest-dev=${GTEST_DEB_VERSION}"
          [ "$(dpkg-query -W -f='${Version}' libgtest-dev)" = "$GTEST_DEB_VERSION" ] \
            || { echo "libgtest-dev is not $GTEST_DEB_VERSION" >&2; exit 1; }

      - name: Stage the Robolectric runtime
        run: |
          curl -sSfL -o "tools/robolectric-deps/${ROBOLECTRIC_JAR}" \
            "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/${ROBOLECTRIC_JAR}"
          (cd tools/robolectric-deps && sha256sum -c MANIFEST.sha256)

      - name: Eleven safeguard cases prove the gate
        run: tools/verify-selftest.sh
